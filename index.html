<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Calculator </title>
	<link rel="stylesheet" href="css/bootstrap.min.css" />
	<script src="js/bootstrap.min.js"></script>
	<script src="js/main.js"></script>
	<style>
		body {
			width: 100%;
			height: 100%;
			display: inline-block;
			margin: 0;
			padding: 0;
		}
		.button-block, .output-block {
			width: 100%;
			display: inline-block;
			padding-top: 15px;
			text-align:center;
			background-color: #e9ecef; 
		}
		.button-block > button {
			min-width: 100px;
			height: auto;
			margin-bottom: 8px;
		}
		.showoprator {
			width: 200px;
			height: 50px;
			display: inline-block;
			background-color: gray;
		}
		#displaydata {
			width:300px;
		}
	</style>
</head>

<body>
	<div class="container">
		<div class="row">
			<div class="col-4 offset-4">
				<div class="button-block">
					<button class="btn btn-primary" onclick="appendNum('1')">1</button>
					<button class="btn btn-primary" onclick="appendNum('2')">2</button>
					<button class="btn btn-primary" onclick="appendNum('3')">3</button>
					<button class="btn btn-primary" onclick="appendNum('4')">4</button>
					<button class="btn btn-primary" onclick="appendNum('5')">5</button>
					<button class="btn btn-primary" onclick="appendNum('6')">6</button>
					<button class="btn btn-primary" onclick="appendNum('7')">7</button>
					<button class="btn btn-primary" onclick="appendNum('8')">8</button>
					<button class="btn btn-primary" onclick="appendNum('9')">9</button>
					<button class="btn btn-primary" onclick="appendNum('0')">0</button>
				</div>
				<div class="button-block">
					<button class="btn btn-primary" onclick="appendOperator('+')">+</button>
					<button class="btn btn-primary" onclick="appendOperator('-')">-</button>
					<button class="btn btn-primary" onclick="appendOperator('*')">*</button>
					<button class="btn btn-primary" onclick="appendOperator('/')">/</button>
					<button class="btn btn-primary" onclick="appendOperator('%')">%</button>
					<button class="btn btn-primary" onclick="calculate()">=</button>
					<button class="btn btn-primary" onclick="clearData()">Clear</button>
				</div>
				<div class="output-block pb-4">
					<h3>Output</h3>
					<input type="text" id="displaydata" readonly/>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
